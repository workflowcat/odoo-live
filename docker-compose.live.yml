# Odoo compute anywhere (this Mac today, a Cloudflare Container or a VPS tomorrow) against the LIVE database on Supabase.
#   docker compose -f docker-compose.live.yml up -d      (reads .env: SUPABASE_DB_* and BP_BRIDGE_TOKEN)
services:
  odoo-live:
    build:
      context: .
      dockerfile: odoo/Dockerfile
    image: odoo-live:local
    container_name: odoo-live-supabase
    ports:
      - "127.0.0.1:8101:8069"
    environment:
      - HOST=${SUPABASE_DB_HOST}
      - PORT=${SUPABASE_DB_PORT:-5432}
      - USER=${SUPABASE_DB_USER}
      - PASSWORD=${SUPABASE_DB_PASSWORD}
      - DB_NAME=odoo
      - ODOO_ADMIN_PASSWD=${ODOO_ADMIN_PASSWD:-}
      - BP_BRIDGE_URL=https://odoo-live.botpartners.workers.dev
      - BP_BRIDGE_TOKEN=${BP_BRIDGE_TOKEN}
    volumes:
      - odoo-live-supabase-data:/var/lib/odoo
volumes:
  odoo-live-supabase-data:
