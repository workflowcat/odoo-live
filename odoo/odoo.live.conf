; Live config: one database (odoo) on Supabase, no DB manager, behind a proxy.
[options]
addons_path = /mnt/extra-addons
db_name = odoo
dbfilter = ^odoo$
list_db = False
db_sslmode = require
proxy_mode = True
log_level = info
limit_time_cpu = 120
limit_time_real = 240
limit_memory_soft = 1610612736
limit_memory_hard = 2415919104
