# Checks for main and pull requests. Both jobs call the same scripts a contributor runs locally.
name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "tests-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: pipx install ruff==0.17.4
      - run: ./scripts/check_static.sh
  odoo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: ".env for a throwaway stack (no secrets, fresh database)"
        run: |
          cp .env.example .env
          sed -i 's/^ODOO_ADMIN_PASSWD=$/ODOO_ADMIN_PASSWD=ci/; s/^ODOO_ADMIN_USER_PASSWORD=$/ODOO_ADMIN_USER_PASSWORD=ci/' .env
      - name: All modules, all test tags, then a clean full install
        run: ./scripts/test_full.sh
