# Local dev stack: Odoo 19 CE + Postgres 17 on this machine. Port ODOO_PORT (default 8100; the payroll worktree uses 8110).
# The LIVE database lives on Supabase; see docker-compose.live.yml and docs/ARCHITECTURE.md.
services:
  db:
    restart: unless-stopped
    image: postgres:17
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-live-db:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "odoo"]
      interval: 5s
      timeout: 5s
      retries: 10
  odoo:
    image: odoo:19
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ODOO_PORT:-8100}:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - BP_BRIDGE_URL=https://odoo-live.botpartners.workers.dev
      - BP_BRIDGE_TOKEN=${BP_BRIDGE_TOKEN:-}
      - ODOO_ADMIN_PASSWD=${ODOO_ADMIN_PASSWD:-}
    # master password comes from .env; the mounted conf stays free of secrets
    command: ["sh", "-c", "cp /etc/odoo/odoo.conf /tmp/odoo.conf && if [ -n \"$$ODOO_ADMIN_PASSWD\" ]; then printf 'admin_passwd = %s\\n' \"$$ODOO_ADMIN_PASSWD\" >> /tmp/odoo.conf; fi && ODOO_RC=/tmp/odoo.conf exec /entrypoint.sh odoo"]
    restart: unless-stopped
    volumes:
      - odoo-live-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./odoo/odoo.local.conf:/etc/odoo/odoo.conf:ro
volumes:
  odoo-live-db:
  odoo-live-data:
