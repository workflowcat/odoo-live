# Local dev stack: Odoo 19 CE + Postgres 17 on this machine. Port 8100.
# The LIVE database lives on Supabase; see docker-compose.live.yml and docs/ARCHITECTURE.md.
services:
  db:
    image: postgres:17
    container_name: odoo-live-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-live-db:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "odoo"]
      interval: 5s
      timeout: 5s
      retries: 10
  odoo:
    image: odoo:19
    container_name: odoo-live-web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8100:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - BP_BRIDGE_URL=https://odoo-live.botpartners.workers.dev
      - BP_BRIDGE_TOKEN=${BP_BRIDGE_TOKEN:-}
    volumes:
      - odoo-live-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./odoo/odoo.local.conf:/etc/odoo/odoo.conf:ro
volumes:
  odoo-live-db:
  odoo-live-data:
