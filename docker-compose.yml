# Local dev stack: Odoo 19 CE + Postgres 17. Odoo on http://127.0.0.1:${ODOO_PORT} (see .env).
# Optional services stay off unless their variables are set in .env (see README, "Optional services").
services:
  db:
    restart: unless-stopped
    image: postgres:17
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-live-db:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "odoo"]
      interval: 5s
      timeout: 5s
      retries: 10
  odoo:
    # Pinned so every clone and CI run tests the same Odoo build; bump the date tag on purpose.
    image: odoo:${ODOO_IMAGE_TAG:-19.0-20261102}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ODOO_PORT:-8100}:8069"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # the hiring extract helper on Linux hosts
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - BP_BRIDGE_URL=${BP_BRIDGE_URL:-}
      - BP_BRIDGE_TOKEN=${BP_BRIDGE_TOKEN:-}
      - UA_KP_URL=${UA_KP_URL:-}
      - UA_EXTRACT_URL=${UA_EXTRACT_URL:-}
      - UA_EXTRACT_TOKEN=${UA_EXTRACT_TOKEN:-}
      - ODOO_ADMIN_PASSWD=${ODOO_ADMIN_PASSWD:-}
    # master password comes from .env; the mounted conf stays free of secrets
    command: ["sh", "-c", "cp /etc/odoo/odoo.conf /tmp/odoo.conf && if [ -n \"$$ODOO_ADMIN_PASSWD\" ]; then printf 'admin_passwd = %s\\n' \"$$ODOO_ADMIN_PASSWD\" >> /tmp/odoo.conf; fi && ODOO_RC=/tmp/odoo.conf exec /entrypoint.sh odoo"]
    restart: unless-stopped
    volumes:
      - odoo-live-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./odoo/odoo.local.conf:/etc/odoo/odoo.conf:ro
volumes:
  odoo-live-db:
  odoo-live-data:
