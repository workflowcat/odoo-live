; Конфіг Odoo для сервера (staging і prod). Статична частина.
; Змінне - db_host, db_name, dbfilter, workers, admin_passwd - дописує deploy/entrypoint.sh
; у /tmp/odoo.conf зі змінних оточення. Дописує, а не замінює: configparser Odoo падає
; на повторюваному ключі, тому цих ключів тут немає.
[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
; менеджер баз вимкнено: бази заводить deploy/deploy.sh, не браузер
list_db = False
; за Cloudflare Tunnel, тому довіряємо заголовкам X-Forwarded-*
proxy_mode = True
log_level = info
; без logfile: лог іде в stdout, його ротує docker (json-file, 10m x 5)
; слухаємо всі інтерфейси контейнера: назовні порт однаково не виходить (127.0.0.1 у compose)
http_interface = 0.0.0.0
limit_time_cpu = 120
limit_time_real = 240
limit_time_real_cron = 600
limit_memory_soft = 1610612736
limit_memory_hard = 2415919104
limit_request = 8192
max_cron_threads = 1
; 16 з'єднань на процес: 2 воркери + cron + gevent < 100 (типова стеля Postgres)
db_maxconn = 16
; у 19.0 це булеве: 'all' дає попередження і все одно читається як True
without_demo = True
