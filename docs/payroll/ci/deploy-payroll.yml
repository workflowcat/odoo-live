# Викладка стенду зарплати у Cloudflare після push у гілку payroll.
# Потрібні секрети репозиторію: CLOUDFLARE_API_TOKEN (права: Workers Scripts Edit, Containers Edit), CLOUDFLARE_ACCOUNT_ID.
# Оновлення модулів у базі: змінити MODULE_OPS і MODULE_OPS_TAG у worker/wrangler.payroll.jsonc у тому самому коміті.
name: deploy-payroll
on:
  push:
    branches: [payroll]
    paths: ["addons/**", "odoo/**", "worker/**", ".github/workflows/deploy-payroll.yml"]
  workflow_dispatch:
concurrency: { group: deploy-payroll, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd worker && npm ci --omit=dev || npm install --omit=dev
      - name: Deploy worker + container image
        run: cd worker && npx wrangler deploy -c wrangler.payroll.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Restart the running instance onto the new image
        run: curl -fsS -m 60 -X POST -H "Authorization: Bearer ${{ secrets.BRIDGE_TOKEN }}" https://odoo-payroll.botpartners.workers.dev/_container/restart || true
